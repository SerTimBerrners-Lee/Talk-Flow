name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write
  checks: read

jobs:
  verify-preflight:
    name: Verify release preflight
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful release preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          target_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          echo "Checking Release Preflight checks for ${RELEASE_REF} (${target_sha})"

          checks_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${target_sha}/check-runs?per_page=100")"

          missing=0
          for check_name in "Preflight macos" "Preflight windows" "Preflight linux"; do
            conclusion="$(jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at // "") | last | .conclusion // ""' <<< "$checks_json")"

            if [[ "$conclusion" != "success" ]]; then
              echo "::error title=Release preflight missing::${check_name} must be successful on ${target_sha} before publishing a release tag. Current conclusion: ${conclusion:-missing}."
              missing=1
            else
              echo "${check_name}: success"
            fi
          done

          if [[ "$missing" != "0" ]]; then
            echo "Run the Release Preflight workflow on the release branch and do not push a release tag until all three platform checks pass."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: verify-preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            bundle_targets: app
            updater_platform: darwin-aarch64
          - platform: windows
            runner: windows-latest
            bundle_targets: nsis
            updater_platform: windows-x86_64
          - platform: linux
            runner: ubuntu-24.04
            bundle_targets: appimage,deb
            updater_platform: linux-x86_64

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TALKIS_STT_RELEASE: "1"
      TALKIS_SKIP_BEFORE_BUILD: "1"
      TALKIS_UPDATER_PLATFORM: ${{ matrix.updater_platform }}
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
      TRANSCRIBE_CMAKE_ARGS: ${{ matrix.platform == 'windows' && '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'macos'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            patchelf \
            clang \
            libclang-dev \
            cmake

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run check:release

      - name: Build bundles
        run: bun run tauri build --bundles ${{ matrix.bundle_targets }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}

      - name: Verify Windows x64 release architecture
        if: matrix.platform == 'windows'
        run: bun run verify:windows-release

      - name: Postprocess macOS release
        if: matrix.platform == 'macos'
        run: bun run postprocess:macos-release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Archive macOS app bundle
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Talkis.app" "Talkis-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-macos.zip"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkis-${{ matrix.platform }}-release
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            Talkis-*-macos.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create updater metadata
        run: bash scripts/create-updater-latest-json.sh "${RELEASE_TAG#v}" "${RELEASE_TAG}"
        env:
          BUILD_ROOT: release-artifacts
          TALKIS_REQUIRED_UPDATER_PLATFORMS: darwin-aarch64,windows-x86_64,linux-x86_64

      - name: Prepare stable download assets
        run: |
          set -euo pipefail

          STABLE_DIR="release-artifacts/stable-downloads"
          mkdir -p "$STABLE_DIR"

          copy_first() {
            local pattern="$1"
            local target="$2"
            local source

            source="$(find release-artifacts -type f -name "$pattern" ! -path "$STABLE_DIR/*" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "Missing release asset matching $pattern" >&2
              exit 1
            fi

            cp "$source" "$STABLE_DIR/$target"
            echo "Prepared $target from $source"
          }

          copy_first "*.dmg" "Talkis-macos.dmg"
          copy_first "*.exe" "Talkis-windows-x64-setup.exe"
          copy_first "*.AppImage" "Talkis-linux-x64.AppImage"

          (
            cd "$STABLE_DIR"
            sha256sum "Talkis-windows-x64-setup.exe" > "Talkis-windows-x64-setup.exe.sha256"
          )

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Talkis ${{ env.RELEASE_TAG }}
          body: |
            Automated release for ${{ env.RELEASE_TAG }}.

            This release publishes native Tauri bundles built on macOS, Windows, and Linux runners. The macOS bundle is signed with a stable Developer ID identity so system permissions survive application updates.

            ### Первый запуск / First launch

            Windows-сборка пока без платной подписи кода — это **не вирус** (исходники открыты, AGPL-3.0). Если ОС блокирует запуск:
            The Windows build is not code-signed yet — this is **not malware** (open source, AGPL-3.0). If your OS blocks it:

            - **Windows** — SmartScreen «защитил ПК» / "protected your PC": **Подробнее → Выполнить в любом случае** (More info → Run anyway).
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.zip
            release-artifacts/**/*.sig
            release-artifacts/**/*.sha256
            release-artifacts/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
